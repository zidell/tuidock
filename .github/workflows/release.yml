# 릴리스: main에 앱 코드가 바뀐 커밋을 푸시하면 TUIDock.app을 유니버설로 빌드해 Developer ID로 서명·공증하고 GitHub Releases에 올린다.
#   버전은 마지막 v 태그의 패치를 하나 올린다. 그 커밋에 v 태그가 이미 있으면 그 버전(부·주 버전을 올릴 때:
#   git tag v0.3.0 && git push --atomic origin main v0.3.0). 문서(docs/·README·AGENTS.md)만 바뀌면 돌지 않는다.
#   TUIDock.dmg — 랜딩 페이지 다운로드(releases/latest/download/TUIDock.dmg)
#   TUIDock-macos.zip — docs/install.sh가 받는다
# 수동 실행(workflow_dispatch)은 서명·공증까지 해서 결과를 아티팩트로 남긴다(점검용). main 끝 커밋에 v 태그가 있으면 그 버전으로 릴리스한다
#   (푸시가 앱 코드를 안 바꿔 릴리스가 안 돈 태그를 내보낼 때).
# 비밀값 이름은 ginote와 같다: APPLE_CERTIFICATE(p12 base64)·APPLE_CERTIFICATE_PASSWORD·APPLE_SIGNING_IDENTITY·
# APPLE_ID·APPLE_PASSWORD(앱 암호)·APPLE_TEAM_ID.
name: release

on:
  push:
    branches: [main]
    paths:
      - app/**
      - launcher/**
      - icon/**
      - tuidock
      - scripts/build-app.sh
      - .github/workflows/release.yml
  workflow_dispatch:

# 푸시가 겹쳐도 하나씩(앞 릴리스의 태그를 보고 다음 버전을 정하도록)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 태그로 다음 버전을 정한다

      - name: Pick version
        run: |
          tag=$(git tag --points-at HEAD -l 'v*' --sort=-v:refname | head -1)
          if [ "$GITHUB_EVENT_NAME" != push ] && [ -z "$tag" ]; then
            echo "TAG=" >> "$GITHUB_ENV"; echo "VERSION=0.0.0" >> "$GITHUB_ENV"; exit 0
          fi
          if [ -z "$tag" ]; then
            last=$(git tag -l 'v*' --sort=-v:refname | head -1)
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "release $tag"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::APPLE_CERTIFICATE 비밀값이 없다"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build universal app
        run: |
          UNIVERSAL=1 scripts/build-app.sh
          lipo -info dist/TUIDock.app/Contents/MacOS/TUIDock

      # 안쪽 실행 파일부터 서명(hardened runtime + 타임스탬프는 공증 조건).
      # 만든 앱에 들어가는 실행기는 tuidock make가 ad-hoc으로 다시 서명한다.
      - name: Sign app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP=dist/TUIDock.app
          for f in "$APP/Contents/Resources/launcher/launcher" "$APP/Contents/Resources/icon/icon" "$APP"; do
            codesign --force --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "$f"
          done
          codesign --verify --strict --deep --verbose=2 "$APP"

      - name: Make DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R dist/TUIDock.app "$stage/"
          ln -s /Applications "$stage/Applications" # DMG 창에서 끌어다 놓을 곳
          hdiutil create -quiet -volname TUIDock -srcfolder "$stage" -format UDZO dist/TUIDock.dmg
          codesign --timestamp -s "$APPLE_SIGNING_IDENTITY" dist/TUIDock.dmg

      # DMG 하나만 공증하면 안의 앱도 같이 등록된다 → DMG와 앱 둘 다 staple
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          out=$(xcrun notarytool submit dist/TUIDock.dmg --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" --wait --output-format json)
          echo "$out"
          status=$(printf '%s' "$out" | plutil -extract status raw -o - -)
          if [ "$status" != Accepted ]; then
            id=$(printf '%s' "$out" | plutil -extract id raw -o - -)
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi
          xcrun stapler staple dist/TUIDock.dmg
          xcrun stapler staple dist/TUIDock.app
          spctl -a -t open --context context:primary-signature -v dist/TUIDock.dmg
          spctl -a -t exec -v dist/TUIDock.app
          ditto -c -k --keepParent dist/TUIDock.app dist/TUIDock-macos.zip
          shasum -a 256 dist/TUIDock.dmg dist/TUIDock-macos.zip

      - name: Upload build (manual run)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: TUIDock
          path: |
            dist/TUIDock.dmg
            dist/TUIDock-macos.zip

      - name: Publish release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/TUIDock.dmg dist/TUIDock-macos.zip \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes "macOS 14+ (Apple Silicon·Intel). TUIDock.dmg: 열어서 TUIDock을 Applications로 끌어다 놓는다 / open it and drag TUIDock to Applications.
          명령 설치 / CLI install: \`curl -fsSL https://zidell.github.io/tuidock/install.sh | bash\`"
