# 릴리스: macOS 서명·공증 번들과 Windows x64 ZIP을 빌드해 같은 버전의 GitHub Release에 올린다.
#   버전은 마지막 v 태그의 패치를 하나 올린다. 그 커밋에 v 태그가 이미 있으면 그 버전(부·주 버전을 올릴 때:
#   git tag v0.3.0 && git push --atomic origin main v0.3.0). 문서(docs/·README·AGENTS.md)만 바뀌면 돌지 않는다.
#   TUIDock.dmg — 랜딩 페이지 다운로드(releases/latest/download/TUIDock.dmg)
#   TUIDock-macos.zip — docs/install.sh가 받는다
# 수동 실행(workflow_dispatch)은 서명·공증까지 해서 결과를 아티팩트로 남긴다(점검용). main 끝 커밋에 v 태그가 있으면 그 버전으로 릴리스한다
#   (푸시가 앱 코드를 안 바꿔 릴리스가 안 돈 태그를 내보낼 때).
# 비밀값 이름은 ginote와 같다: APPLE_CERTIFICATE(p12 base64)·APPLE_CERTIFICATE_PASSWORD·APPLE_SIGNING_IDENTITY·
# APPLE_ID·APPLE_PASSWORD(앱 암호)·APPLE_TEAM_ID.
name: release

on:
  push:
    branches: [main]
    paths:
      - app/**
      - launcher/**
      - icon/**
      - tuidock
      - windows/**
      - '*.go'
      - go.mod
      - scripts/build-app.sh
      - .github/workflows/release.yml
  workflow_dispatch:

# 푸시가 겹쳐도 하나씩(앞 릴리스의 태그를 보고 다음 버전을 정하도록)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick version
        id: version
        run: |
          tag=$(git tag --points-at HEAD -l 'v*' --sort=-v:refname | head -1)
          if [ "$GITHUB_EVENT_NAME" != push ] && [ -z "$tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"; echo "version=0.0.0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$tag" ]; then
            last=$(git tag -l 'v*' --sort=-v:refname | head -1)
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "release $tag"

  build:
    needs: version
    runs-on: macos-15
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 태그로 다음 버전을 정한다

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::APPLE_CERTIFICATE 비밀값이 없다"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build universal app
        run: |
          UNIVERSAL=1 scripts/build-app.sh
          lipo -info dist/TUIDock.app/Contents/MacOS/TUIDock

      # 안쪽 실행 파일부터 서명(hardened runtime + 타임스탬프는 공증 조건).
      # 만든 앱에 들어가는 실행기는 tuidock make가 ad-hoc으로 다시 서명한다.
      - name: Sign app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP=dist/TUIDock.app
          for f in "$APP/Contents/Resources/launcher/launcher" "$APP/Contents/Resources/icon/icon" "$APP"; do
            codesign --force --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "$f"
          done
          codesign --verify --strict --deep --verbose=2 "$APP"

      - name: Make DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R dist/TUIDock.app "$stage/"
          ln -s /Applications "$stage/Applications" # DMG 창에서 끌어다 놓을 곳
          hdiutil create -quiet -volname TUIDock -srcfolder "$stage" -format UDZO dist/TUIDock.dmg
          codesign --timestamp -s "$APPLE_SIGNING_IDENTITY" dist/TUIDock.dmg

      # DMG 하나만 공증하면 안의 앱도 같이 등록된다 → DMG와 앱 둘 다 staple
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          out=$(xcrun notarytool submit dist/TUIDock.dmg --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" --wait --output-format json)
          echo "$out"
          status=$(printf '%s' "$out" | plutil -extract status raw -o - -)
          if [ "$status" != Accepted ]; then
            id=$(printf '%s' "$out" | plutil -extract id raw -o - -)
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi
          xcrun stapler staple dist/TUIDock.dmg
          xcrun stapler staple dist/TUIDock.app
          spctl -a -t open --context context:primary-signature -v dist/TUIDock.dmg
          spctl -a -t exec -v dist/TUIDock.app
          ditto -c -k --keepParent dist/TUIDock.app dist/TUIDock-macos.zip
          shasum -a 256 dist/TUIDock.dmg dist/TUIDock-macos.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: TUIDock-macos
          path: |
            dist/TUIDock.dmg
            dist/TUIDock-macos.zip

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          cache: true
      - name: Build, test and package
        run: ./windows/build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: TUIDock-windows-x64
          path: dist/TUIDock-windows-x64.zip

  publish:
    needs: [version, build, windows]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TUIDock-*
          merge-multiple: true
          path: dist
      - name: Publish one release for both platforms
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          macOS 14+ (Apple Silicon·Intel): TUIDock.dmg을 열고 Applications로 옮긴다 / open TUIDock.dmg and drag to Applications.
          CLI install: `curl -fsSL https://zidell.github.io/tuidock/install.sh | bash`
          Windows 10 1809+ x64: TUIDock-windows-x64.zip을 풀고 tuidock.exe를 실행한다 / extract TUIDock-windows-x64.zip and run tuidock.exe.
          Windows 코드 서명 없음 / Windows build is unsigned. SmartScreen may require More info → Run anyway.
          NOTES
          gh release create "$TAG" dist/TUIDock.dmg dist/TUIDock-macos.zip dist/TUIDock-windows-x64.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
